<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your LiveJournal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fefbd8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
        }
        .entry {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #fff;
        }
        footer {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My LiveJournal</h1>
    </header>
    
    <div class="entry">
        <h2>Diary Entry Title</h2>
        <p>Date: <span>October 20, 2023</span></p>
        <p>Your thoughts and feelings go here...</p>
    </div>

    <footer>
        <p>&copy; 2023 Your Name</p>
    </footer>
</body>
</html>
