<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Entry Title 1</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header, footer {
            text-align: center;
        }
        header {
            background-color: #2D9CDB;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .friend-board {
            margin-top: 30px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #2D9CDB;
            color: white;
        }
        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Diary Entry Title 1</h1>
    </header>
    
    <div class="container">
        <p><strong>Date:</strong> October 20, 2023</p>
        <p>This is my first entry. I am sorting through my memories.</p>
    </div>

    <div class="friend-board">
        <h2>Top Dog Friend Board</h2>
        <table>
            <thead>
                <tr>
                    <th>Friend Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="friendList"></tbody>
        </table>
        <input type="text" id="newFriend" placeholder="Enter friend's name">
        <button onclick="addFriend()">Add Friend</button>
    </div>

    <footer>
        <p>&copy; 2023 Your Name</p>
    </footer>

    <script>
        // Load friend names from localStorage
        function loadFriends() {
            const friends = JSON.parse(localStorage.getItem('friends')) || [];
            friends.forEach(friend => {
                addFriendToList(friend);
            });
        }

        function addFriendToList(friendName) {
            const friendList = document.getElementById("friendList");
            const newRow = document.createElement("tr");
            newRow.innerHTML = `<td>${friendName}</td><td><button onclick="removeFriend(this, '${friendName}')">Delete</button></td>`;
            friendList.appendChild(newRow);
        }

        function removeFriend(button, friendName) {
            const row = button.parentElement.parentElement;
            row.remove(); // Remove the row from the table
            updateFriendsInLocalStorage(friendName, 'remove'); // Update localStorage
        }

        function addFriend() {
            const friendName = document.getElementById("newFriend").value; // Get the input
            if (friendName) {
                addFriendToList(friendName); // Add to the table
                document.getElementById("newFriend").value = ""; // Clear the input
                updateFriendsInLocalStorage(friendName, 'add'); // Update localStorage
            }
        }

        function updateFriendsInLocalStorage(friendName, action) {
            const friends = JSON.parse(localStorage.getItem('friends')) || [];
            if (action === 'add') {
                friends.push(friendName);
            } else if (action === 'remove') {
                const index = friends.indexOf(friendName);
                if (index > -1) {
                    friends.splice(index, 1);
                }
            }
            localStorage.setItem('friends', JSON.stringify(friends)); // Save back to localStorage
        }

        // Load existing friends when the page is loaded
        loadFriends();
    </script>
</body>
</html>
