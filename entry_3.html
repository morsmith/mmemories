<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Entry Title 2</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header, footer {
            text-align: center;
        }
        header {
            background-color: #2D9CDB;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        img {
            max-width: 100%; /* Ensure the image is responsive */
            height: auto;    /* Maintain aspect ratio */
            border-radius: 8px; /* Optional: add border radius */
        }
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #2D9CDB; /* Link color (same as header) */
        }
        a:hover {
            text-decoration: underline; /* Add underline on hover */
        }
        .comments-section {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
        #commentList {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Diary Entry Title 2</h1>
    </header>
    
    <div class="container">
        <p><strong>Date:</strong> January 18, 2026</p>
        <p>Remember what mom said after he left</p>

        <!-- Add your audio file here -->
        <audio controls>
            <source src="audio/lofivision-rain-and-wind-chimes-314370.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <!-- Add your image here -->
        <img src="images/moms stained glass.JPG" alt="my mom made this window">

        <!-- Link to go back to the main index page -->
        <p><a href="index.html">Go back to the main index page</a></p>
    </div>

    <div class="comments-section">
        <h2>How Do <em>You</em> Remember This?</h2>
        <form id="commentsForm">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="comment">Comment:</label><br>
            <textarea id="comment" name="comment" rows="4" required></textarea><br><br>
            
            <button type="submit">Submit</button>
        </form>

        <div id="commentList"></div>
    </div>

    <footer>
        <p>&copy; 2023 Your Name</p>
    </footer>

    <script>
        document.getElementById("commentsForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const comment = document.getElementById("comment").value;

            const commentList = document.getElementById("commentList");
            const newComment = document.createElement("p");
            newComment.textContent = `${name}: ${comment}`;
            commentList.appendChild(newComment);

            // Clear the form
            this.reset();
        });
    </script>
</body>
</html>
