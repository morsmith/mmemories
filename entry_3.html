<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Entry Title 3</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header, footer {
            text-align: center;
        }
        header {
            background-color: #2D9CDB;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .comments-section {
            border-top: 1px solid #ccc;
            padding-top: 20px;
            margin-top: 30px;
        }
        #commentList {
            margin-top: 20px;
        }
        textarea {
            width: 100%; /* Full width */
            padding: 10px; /* Padding for comfort */
        }
    </style>
</head>
<body>
    <header>
        <h1>Diary Entry Title 3</h1>
    </header>
    
    <div class="container">
        <p><strong>Date:</strong> May 25, 2026</p>
        <p>You still went to work the next day.</p>
    </div>

    <div class="comments-section">
        <h2>How Do <em>You</em> Remember This?</h2>
        <form id="commentsForm">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="comment">Comment:</label><br>
            <textarea id="comment" name="comment" rows="4" required></textarea><br><br>
            
            <button type="submit">Submit</button>
        </form>

        <!-- Section where submitted comments will be displayed -->
        <div id="commentList"></div>
    </div>

    <footer>
        <p>&copy; 2023 Your Name</p>
    </footer>

    <script>
        // Handle the comments submission
        document.getElementById("commentsForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            const name = document.getElementById("name").value; // Get name input
            const comment = document.getElementById("comment").value; // Get comment input

            const commentList = document.getElementById("commentList");
            const newComment = document.createElement("p"); // Create a new paragraph
            newComment.textContent = `${name}: ${comment}`; // Format comment
            commentList.appendChild(newComment); // Add comment to the list

            // Clear the form
            this.reset();
        });
    </script>
</body>
</html>
